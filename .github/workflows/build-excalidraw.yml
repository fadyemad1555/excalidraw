name: Build Excalidraw and Upload Artifact

on:
  push:
    branches: [ "master" ]
  # يسمح لك بتشغيل Workflow يدويًا من علامة التبويب Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-build
          path: build/
          retention-days: 7
