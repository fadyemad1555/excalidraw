name: Quick Excalidraw Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  quick-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'yarn'
          
      - name: Install and build
        run: |
          yarn install
          yarn build
          # البحث الفوري عن الملفات المبنية
          find . -name "sw.js" -o -name "workbox-*.js" -o -name "index.html" | grep -v node_modules
          
      - name: Upload entire project (excluding node_modules)
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-full-project
          path: |
            *
            !node_modules
          retention-days: 30
