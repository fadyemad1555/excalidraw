name: Build and Test Excalidraw

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install
        
      - name: Run tests
        run: yarn test:app
        
      - name: Build application
        run: yarn build
        
      - name: Verify build output
        run: |
          echo "Build directory contents:"
          ls -la build/
          echo "Total files in build: $(find build/ -type f | wc -l)"
          
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-production-build
          path: |
            build/
            package.json
          retention-days: 30
          compression-level: 9
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            junit.xml
          retention-days: 15

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run security audit
        run: yarn audit --level moderate
