name: Build and Package Excalidraw

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install
        
      - name: Run tests
        run: yarn test:app
        
      - name: Build application
        run: |
          yarn build
          echo "✅ البناء اكتمل بنجاح"
        
      - name: Verify build directory exists
        run: |
          echo "=== التحقق من وجود مجلد build ==="
          pwd
          ls -la
          sleep 2
          echo "=== محتويات مجلد build ==="
          ls -la build/ || echo "❌ مجلد build غير موجود مباشرة بعد البناء"
        
      - name: Wait and retry build directory
        run: |
          echo "=== إعادة المحاولة بعد انتظار ==="
          sleep 5
          ls -la build/ && echo "✅ مجلد build موجود الآن" || echo "❌ مجلد build لا يزال غير موجود"
        
      - name: Upload complete build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-production-build
          path: build/
          retention-days: 30
          compression-level: 9
          if-no-files-found: error

      - name: Create deployment package
        run: |
          echo "=== إنشاء حزمة نشر ==="
          mkdir -p dist-package
          cp -r build/* dist-package/
          cp package.json dist-package/
          echo "✅ حزمة النشرهي جاهزة"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-deployment-package
          path: dist-package/
          retention-days: 30

  final-verification:
    runs-on: ubuntu-latest
    needs: build-and-package
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: excalidraw-production-build
          path: downloaded-build
          
      - name: Verify downloaded files
        run: |
          echo "=== التحقق من الملفات التي تم تحميلها ==="
          cd downloaded-build
          find . -type f -name "*.js" | head -10
          echo "=== إجمالي الملفات ==="
          find . -type f | wc -l
          echo "=== حجم المجلد ==="
          du -sh .
