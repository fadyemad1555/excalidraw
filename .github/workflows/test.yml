name: Build and Test Excalidraw

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install
        
      - name: Run tests
        run: yarn test:app
        
      - name: Build application
        run: yarn build
        
      - name: Find and list all files after build
        run: |
          echo "=== البحث عن مجلد build ==="
          find . -name "build" -type d 2>/dev/null || echo "لم يتم العثور على مجلد build"
          
          echo "=== البحث عن ملفات JavaScript ==="
          find . -name "*.js" -path "*/build/*" 2>/dev/null | head -10 || echo "لم يتم العثور على ملفات JS في build"
          
          echo "=== الملفات في المجلد الجذر ==="
          ls -la
          
          echo "=== البحث عن أي مجلدات تحتوي على sw.js ==="
          find . -name "sw.js" 2>/dev/null || echo "لم يتم العثور على sw.js"
          
      - name: Upload ALL built files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-complete-build
          path: |
            .
          retention-days: 30
          compression-level: 9

  analyze-structure:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: excalidraw-complete-build
          
      - name: Analyze file structure
        run: |
          echo "=== هيكل الملفات بعد البناء ==="
          find . -type f -name "*.js" | grep -v node_modules | head -20
          echo "=== المجلدات الرئيسية ==="
          ls -la
